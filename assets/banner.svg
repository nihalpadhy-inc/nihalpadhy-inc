<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">Nihal Padhy</title>
  <desc id="d">Co-founder and CEO of Praxys Solutions. Building at the intersection of AI, Business, and Data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121010"/>
      <stop offset="0.55" stop-color="#1d1410"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#b8471a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7a2e0e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7a2e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ff7a2a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff8c42" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="500" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>
    <rect width="1200" height="500" fill="url(#glow)"/>

    <!-- circuit traces, right side -->
    <g fill="none" stroke="#ff8c42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1210 120H1080L1030 170H930" stroke-opacity="0.55"/>
      <path d="M1210 160H1100L1040 220H980" stroke-opacity="0.4"/>
      <path d="M1210 200H1120L1060 260H890" stroke-opacity="0.6"/>
      <path d="M1210 250H1140L1090 300H1010L980 330H900" stroke-opacity="0.35"/>
      <path d="M1210 300H1160L1110 350H960" stroke-opacity="0.5"/>
      <path d="M1210 350H1170L1120 400H1050L1020 430H940" stroke-opacity="0.3"/>
    </g>
    <g fill="#ff8c42">
      <circle cx="930" cy="170" r="5" fill-opacity="0.85"/>
      <circle cx="980" cy="220" r="4" fill-opacity="0.6"/>
      <circle cx="890" cy="260" r="5" fill-opacity="0.9"/>
      <circle cx="900" cy="330" r="4" fill-opacity="0.5"/>
      <circle cx="960" cy="350" r="5" fill-opacity="0.75"/>
      <circle cx="940" cy="430" r="4" fill-opacity="0.45"/>
    </g>
    <g fill="none" stroke="#ff8c42" stroke-opacity="0.5" stroke-width="1.5">
      <rect x="1052" y="232" width="56" height="56" rx="6"/>
      <rect x="1064" y="244" width="32" height="32" rx="3" stroke-opacity="0.3"/>
    </g>

    <!-- accent rule -->
    <rect x="72" y="92" width="64" height="7" rx="3.5" fill="#ff8c42"/>
    <text x="156" y="101" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="20" letter-spacing="4" fill="#ffb27a" fill-opacity="0.75">PRAXYS SOLUTIONS</text>

    <!-- name -->
    <text x="68" y="250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="136" textLength="760" lengthAdjust="spacingAndGlyphs" fill="url(#name)">NIHAL PADHY</text>

    <!-- role -->
    <text x="72" y="330" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="46" fill="#ffd9bd">Co-founder &amp; CEO of Praxys Solutions</text>

    <!-- tagline -->
    <rect x="72" y="372" width="4" height="44" fill="#ff8c42"/>
    <text x="96" y="404" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="32" fill="#e8b48f">Building at the intersection of <tspan fill="#ff9a4d" font-weight="700">AI</tspan>, <tspan fill="#ff9a4d" font-weight="700">Business</tspan>, and <tspan fill="#ff9a4d" font-weight="700">Data</tspan>.</text>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="17" fill="none" stroke="#ff8c42" stroke-opacity="0.35" stroke-width="2"/>
</svg>
